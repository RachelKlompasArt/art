<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery - Rachel Klompas Art</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="global-fixed-bg"></div>
    <a href="index.html" class="back-home-btn"><span class="arrow">&#9664;&#xFE0E;</span> Home</a>
    
    <!-- Hamburger Navigation -->
    <div class="hamburger-container">
        <div class="hamburger-icon" id="hamburger-icon">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
        <div class="dropdown-menu" id="dropdown-menu">
            <a href="index.html">Home</a>
            <a href="gallery.html">Gallery</a>
            <a href="aboutMe.html">About Me</a>
        </div>
    </div>

    <main id="gallery-container"></main>

    <div id="imageModal" class="modal">
        <div id="modalBgTitle" class="modal-bg-title"></div> 
        <span class="close">&times;</span>
        <div class="modal-layout">
            <div class="modal-image-container">
                <div class="modal-nav">
                    <span id="prev" class="nav-arrow">&#10094;</span>
                    <span id="next" class="nav-arrow">&#10095;</span>
                </div>
                <img id="modalImage">
            </div>
            <div class="modal-plaque">
                <h2 id="modalTitle">Title</h2>
                <p id="modalMedium">Medium</p>
                <p id="modalSize">Size</p>
                <p id="modalPrice">Price</p>
            </div>
        </div>
    </div>

    <div id="contact-widget-container">
        <div id="contact-popup" class="contact-popup">
            <div class="contact-header">
                <h3>Have any questions?</h3>
                <span id="close-popup">&times;</span>
            </div>
            <div class="contact-body">
                <textarea id="contact-message" placeholder="Ask about an artwork, pricing, or commissions..."></textarea>
                <div class="contact-actions">
                    <button id="send-whatsapp" class="action-btn wa-btn">WhatsApp</button>
                    <button id="send-email" class="action-btn email-btn">Email</button>
                </div>
            </div>
        </div>
        <div id="contact-greeting" class="contact-greeting">Hi, be in touch if there is something specific you would like</div>
        <div id="contact-bubble" class="contact-bubble">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 2H4C2.9 2 2 2.9 2 4V22L6 18H20C21.1 18 22 17.1 22 16V4C22 2.9 21.1 2 20 2Z" fill="#ffffff"/>
            </svg>
        </div>
    </div>

    <script src="gallery.js"></script>
</body>
</html>
